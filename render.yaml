# Free web service; persistent data lives in an external PostgreSQL database.
# Choose a free Neon project within its published usage limits, then paste its
# connection string into DATABASE_URL in Render's private environment settings.
services:
  - type: web
    name: shanab-barber
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/public
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
